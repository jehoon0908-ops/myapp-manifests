apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/jehoon0908-ops/myapp:sha-24674a235e3da4942048dec3a67bc764ad967100
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
