apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: 10.10.20.220:30002/myapp/myapp:sha-017c253b193727e4fc7aa3fb4a1c8a6a909dba84
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
